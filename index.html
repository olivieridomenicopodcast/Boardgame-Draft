<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dicetidice Boardgame Draft</title>
  <meta name="description" content="La challenge di draft di Dicetidice: scegli una caratteristica alla volta e realizza davvero il tuo gioco da tavolo.">
  <meta name="theme-color" content="#14110f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!-- iOS -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Boardgame Draft">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/icon.svg" alt="" width="96" height="96" class="splash-logo">
    <h1>Dicetidice Boardgame Draft</h1>
    <p id="splash-fact" class="muted">Mescolo i dadi…</p>
  </div>

  <div id="update-banner" role="alert" hidden></div>
  <div id="app"><main id="view" tabindex="-1"></main></div>
  <button id="build-badge" type="button" aria-label="Informazioni sulla build" aria-expanded="false">build …</button>
  <div id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:2rem;color:#f4ead8">Questa app richiede JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
