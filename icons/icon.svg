  <!-- il dado -->
  <rect x="146" y="214" width="220" height="220" rx="44" fill="url(#die)" stroke="#14110f" stroke-width="12"/>
  <g fill="#14110f">
    <circle cx="192" cy="260" r="21"/><circle cx="320" cy="260" r="21"/>
    <circle cx="256" cy="324" r="21"/>
    <circle cx="192" cy="388" r="21"/><circle cx="320" cy="388" r="21"/>
